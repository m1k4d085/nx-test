<form [formGroup]="formGroup" (submit)="submit()" class="mb-8">
  <div class="flex flex-col gap-2">
    <label for="nome">Nome: </label>
    <input type="text" formControlName="nome" id="nome" class="border border-slate-400 rounded mb-4" />
  </div>
  <div class="flex flex-col gap-2">
    <label for="nome">Cognome: </label>
    <input type="text" formControlName="cognome" id="cognome" class="border border-slate-400 rounded mb-4" />
  </div>
  <button type="submit" class="bg-amber-700 px-4 py-2 rounded text-white" >Aggiungi</button>
</form>
<table class="table-fixed border-collapse border border-slate-400">
  <thead>
    <tr class="bg-amber-400">
      <th class="border border-slate-400 px-4 py-2">ID</th>
      <th class="border border-slate-400 px-4 py-2">Nome</th>
      <th class="border border-slate-400 px-4 py-2">Cognome</th>
      <th class="border border-slate-400 px-4 py-2"></th>
    </tr>
  </thead>
  <tbody>
    <!-- <tr *ngFor="let patient of (patients$ | async)" class="odd:bg-amber-200 even:bg-amber-400">
            <td class="border border-slate-400 px-4 py-2">{{ patient.id }}</td>
            <td class="border border-slate-400 px-4 py-2">{{ patient.nome }}</td>
            <td class="border border-slate-400 px-4 py-2">{{ patient.cognome }}</td>
            <td class="border border-slate-400 px-4 py-2"></td>
        </tr> -->
    @for(patient of (patients$ | async); track $index) {
    <tr class="odd:bg-amber-200 even:bg-amber-400">
      <td class="border border-slate-400 px-4 py-2">{{ patient.id }}</td>
      <td class="border border-slate-400 px-4 py-2">{{ patient.nome }}</td>
      <td class="border border-slate-400 px-4 py-2">{{ patient.cognome }}</td>
      <td class="border border-slate-400 px-4 py-2"></td>
    </tr>
    }
  </tbody>
</table>
