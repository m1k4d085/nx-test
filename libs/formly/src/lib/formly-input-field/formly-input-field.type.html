<div class="flex flex-col gap-2 my-4">
  <label [for]="id" class="font-bold">{{ props.label }}{{ props.required ? ' *' : '' }}</label>
  <input
    [id]="id"
    class="border border-gray-500 focus:border-gray-700 focus:outline focus:outline-green-400 px-2 py-1 rounded"
    [formControl]="formControl"
    [formlyAttributes]="field"
    [readonly]="props.readonly || false"
    [type]="props.type || 'text'"
    [disabled]="!!props.disabled"
  />
</div>
